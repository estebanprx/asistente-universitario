
<div class="register-container">

    <!-- ENCABEZADO -->
    <h2>Crear cuenta</h2>

    <p>Únete a nuestra experiencia Racing</p>

    <!-- FORMULARIO -->
    <form
        [formGroup]="formRegister"
        (ngSubmit)="registrarUsuario()"
        id="registerForm"
    >

        <!-- NOMBRE COMPLETO -->
        <div class="input-group">

            <label for="nombre">
                Nombre completo
            </label>

            <input
                type="text"
                id="nombre"
                formControlName="nombre"
                placeholder="Ingresa tu nombre completo"
            >

            <small
                class="error-message"
                *ngIf="
                    formRegister.get('nombre')?.touched &&
                    formRegister.get('nombre')?.invalid
                "
            >
                El nombre es obligatorio y debe tener mínimo 3 caracteres.
            </small>

        </div>

        <!-- CORREO ELECTRÓNICO -->
        <div class="input-group">

            <label for="email">
                Correo electrónico
            </label>

            <input
                type="email"
                id="email"
                formControlName="email"
                placeholder="Ingresa tu correo electrónico"
            >

            <small
                class="error-message"
                *ngIf="
                    formRegister.get('email')?.touched &&
                    formRegister.get('email')?.invalid
                "
            >
                Ingresa un correo electrónico válido.
            </small>

        </div>

        <!-- CONTRASEÑA -->
        <div class="input-group">

            <label for="password">
                Contraseña
            </label>

            <input
                type="password"
                id="password"
                formControlName="password"
                placeholder="Crea una contraseña"
            >

            <small
                class="error-message"
                *ngIf="
                    formRegister.get('password')?.touched &&
                    formRegister.get('password')?.invalid
                "
            >
                La contraseña debe tener mínimo 8 caracteres.
            </small>

        </div>

        <!-- CONFIRMAR CONTRASEÑA -->
        <div class="input-group">

            <label for="confirmPassword">
                Confirmar contraseña
            </label>

            <input
                type="password"
                id="confirmPassword"
                formControlName="confirmPassword"
                placeholder="Confirma tu contraseña"
            >

            <small
                class="error-message"
                *ngIf="
                    formRegister.hasError('passwordMismatch') &&
                    formRegister.get('confirmPassword')?.touched
                "
            >
                Las contraseñas no coinciden.
            </small>

        </div>

        <!-- BOTÓN CREAR CUENTA -->
        <button
            type="submit"
            class="register-button"
        >
            Crear cuenta
        </button>

        <!-- BOTÓN VOLVER AL LOGIN -->
        <a
            routerLink="/login"
            class="back-button"
        >
            Volver al inicio de sesión
        </a>

    </form>

    <!-- ENLACE PARA INICIAR SESIÓN -->
    <div class="login-link">

        ¿Ya tienes una cuenta?

        <a routerLink="/login">
            Inicia sesión
        </a>

    </div>

</div>
